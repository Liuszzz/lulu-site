<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>璐透一下 - R.E.D</title>
<link rel="icon" href="https://www.red-official.cn/static/red-logo.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 顶部头图区 */
  .hero {
    position: relative;
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    height: 300px;
    overflow: hidden;
  }
  .hero-bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(6px);
    transform: scale(1.05);
  }
  .hero-mask {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
  }
  .back-btn {
    position: absolute;
    top: 20px; left: 16px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    z-index: 2;
    opacity: 0.85;
    text-decoration: none;
  }
  .back-btn svg { width: 18px; height: 18px; }
  .hero-info {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 2;
  }
  .hero-avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.1);
  }
  .hero-name {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 16px;
    font-weight: 500;
  }
  .hero-name .verify-badge {
    width: 14px; height: 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-name .verify-badge svg { width: 14px; height: 14px; }
  .hero-intro {
    margin-top: 4px;
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .hero-tags {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .hero-tag {
    padding: 3px 12px;
    border-radius: 25px;
    background: rgba(255,255,255,0.15);
    font-size: 12px;
    text-transform: uppercase;
  }
  /* Tab 栏 */
  .tab-bar {
    position: relative;
    max-width: 540px;
    margin: 0 auto;
    background: #1a1a1a;
    border-radius: 12px 12px 0 0;
    margin-top: -20px;
    z-index: 3;
    display: flex;
    padding: 0 16px;
  }
  .tab-item {
    padding: 15px 0;
    margin-right: 50px;
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
    position: relative;
  }
  .tab-item.active {
    color: #fff;
  }
  .tab-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: #D70832;
  }
  /* 帖子列表 */
  .posts-container {
    max-width: 540px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .post-card {
    background: #2D2D2D;
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.15s;
  }
  .post-card:active {
    background: #333;
  }
  .post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 16px 0;
  }
  .post-user {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .post-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
  }
  .post-meta {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 40px;
  }
  .post-name {
    font-size: 13px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .post-name .verify-badge {
    width: 14px; height: 14px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .post-name .verify-badge svg { width: 14px; height: 14px; }
  .post-time {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #B8B8B8;
    font-weight: 300;
  }
  .post-content {
    padding: 12px 16px;
    font-size: 14px;
    color: #fff;
    font-weight: 300;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* 图片网格 */
  .img-grid {
    padding: 0 16px 8px;
  }
  .img-grid.single {
    padding: 0 16px 8px;
  }
  .img-grid.single img {
    width: 100%;
    border-radius: 6px;
    display: block;
  }
  .img-grid.multi {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 0 16px 8px;
  }
  .img-grid.multi img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 4px;
    cursor: pointer;
  }
  /* 视频 */
  .post-video-wrap {
    padding: 0 16px 8px;
  }
  .post-video {
    width: 100%;
    border-radius: 6px;
    display: block;
  }
  /* 底部交互 */
  .post-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px 16px;
  }
  .post-actions {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .action-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .action-item svg {
    width: 20px; height: 20px;
  }
  .action-count {
    font-size: 13px;
    color: #fff;
    font-weight: 300;
  }
  /* 无更多帖子 */
  .no-more {
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    padding: 30px 0;
  }
  /* 图片预览 */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
  }
  .lightbox.active {
    display: flex;
  }
  .lightbox img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 4px;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 20px;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    opacity: 0.7;
  }
  /* 顶部Logo */
  .top-logo {
    position: absolute;
    top: 18px;
    right: 16px;
    z-index: 2;
    opacity: 0.85;
  }
  .top-logo svg {
    width: 32px; height: 32px;
  }
  @media (min-width: 768px) {
    .hero { max-width: 35.5vw; height: 360px; }
    .hero-avatar { width: 120px; height: 120px; }
    .hero-name { font-size: 18px; }
    .posts-container, .tab-bar { max-width: 35.5vw; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="data.js"></script>
<script>
// === SVG 图标 ===
const ICONS = {
  like: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#fff" stroke="#fff" stroke-width="0"/></svg>',
  comment: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>',
  logo: '<svg viewBox="0 0 100 100" fill="#fff"><circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="2"/><text x="50" y="58" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">R.E.D</text></svg>',
  verify: '<svg viewBox="0 0 16 16" fill="#fff"><path d="M8 0L9.6 1.6L12 1.2L12.4 3.6L14.4 4.8L13.2 6.8L14.4 8.8L12.4 10L12 12.4L9.6 12L8 13.6L6.4 12L4 12.4L3.6 10L1.6 8.8L2.8 6.8L1.6 4.8L3.6 3.6L4 1.2L6.4 1.6L8 0Z" fill="#D70832"/><path d="M5 8L7 10L11 6" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

// === 渲染 ===
const app = document.getElementById('app');
const actor = SITE_DATA.actor;
const posts = SITE_DATA.posts;

function formatLike(n) {
  if (n > 999) return (n / 1000).toFixed(1) + 'K';
  return n;
}

function renderHero() {
  const tagsHtml = (actor.actorTag || []).map(t =>
    '<span class="hero-tag">' + t + '</span>'
  ).join('');

  return `
    <div class="hero">
      <img class="hero-bg" src="${actor.actorAvatar}" alt="">
      <div class="hero-mask"></div>
      <a class="back-btn" href="https://www.red-official.cn/#/pages/artist?id=${actor.actorId}">
        ${ICONS.back}
        <span>返回</span>
      </a>
      <div class="top-logo">${ICONS.logo}</div>
      <div class="hero-info">
        <img class="hero-avatar" src="${actor.actorAvatar}" onclick="openLightbox('${actor.actorAvatar}')">
        <div class="hero-name">
          <span>${actor.actorName}</span>
          <span class="verify-badge">${ICONS.verify}</span>
        </div>
        <div class="hero-intro">${actor.actorIntro || ''}</div>
        <div class="hero-tags">${tagsHtml}</div>
      </div>
    </div>
  `;
}

function renderPost(post) {
  let mediaHtml = '';

  if (post.fileType === '0' && post.imgList.length > 0) {
    if (post.imgList.length === 1) {
      mediaHtml = '<div class="img-grid single"><img src="' + post.imgList[0] + '" loading="lazy" onclick="openLightbox(\'' + post.imgList[0] + '\')"></div>';
    } else {
      mediaHtml = '<div class="img-grid multi">' + post.imgList.map(function(img) {
        return '<img src="' + img + '" loading="lazy" onclick="openLightbox(\'' + img + '\')">';
      }).join('') + '</div>';
    }
  } else if (post.fileType === '1' && post.topicsVideo) {
    mediaHtml = '<div class="post-video-wrap"><video class="post-video" controls preload="none" poster="' + post.topicsVideo + '?x-oss-process=video/snapshot,t_0,f_jpg" src="' + post.topicsVideo + '"></video></div>';
  } else if (post.fileType === '2' && post.topicsTape) {
    mediaHtml = '<div style="padding:8px 16px"><audio controls src="' + post.topicsTape + '" style="width:100%"></audio></div>';
  }

  return `
    <div class="post-card">
      <div class="post-header">
        <div class="post-user">
          <img class="post-avatar" src="${post.actorAvatar}" alt="">
          <div class="post-meta">
            <div class="post-name">${post.actorName}<span class="verify-badge">${ICONS.verify}</span></div>
            <div class="post-time">
              <span>${post.day}</span>
              <span>${post.clock}</span>
              ${post.status == '2' ? '<span style="color:#fff">(审核中)</span>' : ''}
            </div>
          </div>
        </div>
      </div>
      <div class="post-content">${post.topicsContent || ''}</div>
      ${mediaHtml}
      <div class="post-footer">
        <div class="post-actions">
          <div class="action-item">
            ${ICONS.like}
            <span class="action-count">${formatLike(post.like)}</span>
          </div>
          <div class="action-item">
            ${ICONS.comment}
            <span class="action-count">${formatLike(post.comment)}</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function render() {
  let html = renderHero();

  html += `
    <div class="tab-bar">
      <div class="tab-item active">帖子</div>
      <div class="tab-item">评论</div>
    </div>
  `;

  html += '<div class="posts-container">';
  posts.forEach(function(post) {
    html += renderPost(post);
  });
  html += '<div class="no-more">没有更多帖子了~</div>';
  html += '</div>';

  app.innerHTML = html;
}

// Lightbox
function openLightbox(url) {
  var lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = url;
  lb.classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

render();
</script>
</body>
</html>
